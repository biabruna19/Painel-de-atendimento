</main>

<div id="rodape"></div>
<script>
// Números contam de 0 até o valor quando aparecem na tela
(function () {
    const itens = document.querySelectorAll('[data-contar]');
    const animar = (el) => {
        const alvo = +el.dataset.contar;
        const inicio = alvo > 1000 ? alvo - 30 : 0;
        const t0 = performance.now();
        const passo = (agora) => {
            const p = Math.min(1, (agora - t0) / 1200);
            el.textContent = Math.round(inicio + (alvo - inicio) * (1 - Math.pow(1 - p, 3)));
            if (p < 1) requestAnimationFrame(passo);
        };
        requestAnimationFrame(passo);
    };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return;
    const obs = new IntersectionObserver((ent) => ent.forEach(e => { if (e.isIntersecting) { animar(e.target); obs.unobserve(e.target); } }), { threshold: .5 });
    itens.forEach(el => obs.observe(el));
})();
</script>
</body>
</html>
