<!DOCTYPE html>
<html lang="pt-BR" data-titulo="atalho.tv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo TV · Hospital Santa Cecilia</title>
    <meta name="description" content="Tela da sala de espera com as senhas chamadas.">
    <meta name="author" content="Beatriz Oliveira">
    <meta name="theme-color" content="#053d2e">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/estilo.css?v=202611261610">
    <script src="./js/textos.js?v=202611261610"></script>
    <script src="./js/i18n.js?v=202611261610"></script>
</head>
<body>
<div class="tv">
    <header class="tv-topo">
        <a class="marca" href="./fila.html" id="tvMarca" aria-label="Hospital Santa Cecilia"></a>
        <div class="tv-relogio"><strong id="tvHora"></strong><span id="tvData"></span></div>
    </header>

    <main class="tv-corpo" id="conteudo">
        <section class="tv-chamada" id="tvChamada" aria-live="assertive"></section>
        <aside class="tv-lateral">
            <h2 data-i18n="tv.ultimas"></h2>
            <ul class="tv-ultimas" id="tvUltimas"></ul>
            <div class="tv-espera">
                <div><small data-i18n="tv.normal"></small><strong id="tvNormal">0</strong></div>
                <div><small data-i18n="tv.prioritario"></small><strong id="tvPrioritario">0</strong></div>
            </div>
        </aside>
    </main>

    <footer class="tv-rodape">
        <span class="rotulo" data-i18n="tv.letreiro"></span>
        <div class="tv-letreiro"><div id="tvLetreiro"></div></div>
    </footer>
</div>

<div class="tv-ativar" id="tvAtivar">
    <div>
        <span class="marca-icone" style="width:64px;height:64px"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true" style="width:30px;height:30px"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></span>
        <h1 style="color:#fff;font-size:1.8rem" data-i18n="tv.ativar"></h1>
        <p data-i18n="tv.ativar.t"></p>
        <button type="button" class="botao botao-primario botao-grande" id="tvSomSim" data-i18n="tv.ativar"></button>
        <button type="button" class="botao botao-vidro" id="tvSomNao" data-i18n="tv.sem.som"></button>
    </div>
</div>

<script src="./js/fila.js?v=202611261610"></script>
<script src="./js/tv.js?v=202611261610"></script>
</body>
</html>
