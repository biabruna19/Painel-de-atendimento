<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Santa Cecilia - Painel de Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      
        .bg-primary {
            background-color: #000000;
        }

        
        .text-primary {
            color: #000000;
        }

        .bg-highlight {
            background-color: #4c82ff;
        }

        .text-highlight {
            color: #3d7cfb;
        }

        .focus\:ring-highlight:focus {
            --tw-ring-color: #404cfa;
        }


        .queue-item-p {
            background-color: #1a1a1a;
            border-left: 4px solid #2274a3;

            box-shadow: none;
        }

        .queue-item-n {
            background-color: #ffffff;
            border-left: 4px solid #4bbefc;
            box-shadow: none;
        }

        .carousel-container {
            width: 60%;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.64);
            width: fit-content;
        }

        .carousel-item {
            width: 100vw;
            flex-shrink: 0;
        }

        /* Hero Section (Fundo Estiloso mantendo apenas as cores pedidas) */
        .hero-section {
            background: linear-gradient(135deg, #253d7e 0%, #040445 100%);
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="80" r="10" fill="rgba(255,255,255,0.05)"/><circle cx="80" cy="30" r="15" fill="rgba(255,255,255,0.05)"/><circle cx="50" cy="50" r="8" fill="rgba(255,255,255,0.05)"/></svg>');
            background-size: 150px;
            opacity: 1;
        }

        /* Garante que o conteúdo fique por cima do fundo estilizado */
        .hero-content {
            position: relative;
            z-index: 20;
        }

        /* AJUSTE PRINCIPAL: Garante que o cartão do formulário tenha o Z-index mais alto (50) */
        .form-card {
            z-index: 50 !important;
            position: relative;
        }
    </style>
</head>

            return state.tickets

                .sort((a, b) => {
                    if (a.priority !== b.priority) {
                        return b.priority - a.priority;
                    }
                    return a.timestamp.getTime() - b.timestamp.getTime();
                });
        };

        const toggleContrast = () => {
            // Inverte o valor atual: Se for true, vira false; se for false, vira true.
            const newContrastState = !state.highContrast;

            // 🔑 CHAMA O UPDATESTATE COM O NOVO VALOR
            updateState({ highContrast: newContrastState });

        };

        const getEstimatedWaitTime = (sortedQueue, currentCalling) => {
            const avgNormalTime = 5;
            const avgPriorityTime = 8;
            let timeFromCurrent = 0;
            if (currentCalling) {
                timeFromCurrent = currentCalling.category === 'Prioritário' ? avgPriorityTime : avgNormalTime;
            }
            let estimatedTime = 0;
            for (let i = 0; i < sortedQueue.length; i++) {
                const ticket = sortedQueue[i];
                estimatedTime += ticket.category === 'Prioritário' ? avgPriorityTime : avgNormalTime;
            }
            return (timeFromCurrent + estimatedTime);
        };

        const advanceQueue = () => {
            const currentCalling = state.tickets.find(t => t.status === 'calling');
            const sortedQueue = getSortedQueue();

            if (currentCalling) {
                currentCalling.status = 'finished';
            }

            if (sortedQueue.length > 0) {
                const nextTicket = sortedQueue[0];
                nextTicket.status = 'calling';
            }

            updateState({ tickets: [...state.tickets] });
        };

        const createTicket = (category) => {
            const key = category === 'Prioritário' ? 'P' : 'N';
            state.lastTicketNumber[key] += 1;
            const newNumber = key + String(state.lastTicketNumber[key]).padStart(3, '0');

            const newTicket = {
                id: Date.now(),
                number: newNumber,
                category: category,
                priority: category === 'Prioritário' ? 5 : 2,
                status: 'waiting',
                timestamp: new Date(),

            updateState({ tickets: [...state.tickets, newTicket] });
            alert(`${t('dispense_title')}: ${newNumber} - ${category}. Guarde sua senha.`);

                    activeClasses = 'bg-blue-700 text-white font-semibold shadow-md';

        };

        const startQueueAdvance = () => {
            if (state.queueAdvanceIntervalId) clearInterval(state.queueAdvanceIntervalId);
            state.queueAdvanceIntervalId = setInterval(advanceQueue, 30000);
        }

        // Expõe funções globais para o HTML
        window.updateState = updateState;
        window.navigate = navigate;
        window.toggleLanguage = toggleLanguage;
        window.handleScheduleSubmit = handleScheduleSubmit;
        window.handleFeedback = handleFeedback;
        window.createTicket = createTicket;
        window.advanceQueue = advanceQueue;

        /* --- Inicialização --- */
        document.addEventListener('DOMContentLoaded', () => {
            try {
                startClock();
                startQueueAdvance();
                startCarousel();
                renderApp();
            } catch (error) {
                console.error("Erro Crítico ao iniciar a aplicação:", error);
            }
        });

        // --- FIM DO CÓDIGO JAVASCRIPT ---
    </script>
</body>

</html>
